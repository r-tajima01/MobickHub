name: バグ報告 (Bug Report)
description: 想定と違う動作・エラー・データ不整合の報告。
title: "[バグ] "
labels: ["type:バグ", "stage:1-受付"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 何が起きたか (1行)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: エラーメッセージ・スクリーンショット・ログがあれば貼る。
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: 発生環境
      options:
        - 本番 (Vercel)
        - ローカル (npm run dev)
        - 両方
        - 不明
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 影響度
      options:
        - 重大 (機能停止・データ破損)
        - 中 (主要機能に支障)
        - 軽微 (見た目・誤字)
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: その他メモ
      description: 直前の操作、関連 PR、推測される原因など。
    validations:
      required: false
